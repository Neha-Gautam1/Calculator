<!DOCTYPE html>
<html>
<head>
	<title>Calculator</title>
	<link rel="stylesheet" type="text/css" href="Calculator.css">
	<style>*{
	margin: 0;
	padding: 0;
	box-sizing: border-box;
	background-color: #ecf0f3;
	font-family: sans-serif;
	outline: none;
}
.container{
	height: 100vh;
	display: flex;
	justify-content: center;
	align-items: center;
}
.calculator{
	background-color:pink;
	padding: 15px;
	border-radius: 30px;
	box-shadow: inset 5px 5px  12px #ffffff,
	            5px 5px 12px rgba(0,0,0,.16);
	display: grid;
	grid-template-columns: repeat(4,68px);
}

input{
	grid-column: span 4;
	height: 70px;
	width: 260px;
	background-color: #ecf0f3;
	box-shadow: inset -5px -5px 12px #ffffff,
	             inset  5px 5px 12px rgba(0,0,0,.16);
	             border: none;
	             border-radius: 30px;
	   color: rgb(70,70,70);
	   font-size:50px;
	   text-align: end;
	   margin: auto;
	   margin-top:40px;
	   margin-bottom: 30px;
	   padding: 20px;
}
button{
	height: 48px;
	width: 48px;
	background-color: #ecf0f3;
	box-shadow:-5px -5px 12px #ffffff,
	      5px 5px 12px rgb(0,0,0,.16);
	      border: none;
	      border-radius: 50%;
	      margin: 8px;
	      font-size: 16px;
	      font-weight: 600;
}
.equal{
	width: 115px;
	border-radius: 40px;
	background-color: #ecf0f3;
	box-shadow:-5px -5px 12px #ffffff,
	      5px 5px 12px rgb(0,0,0,.16);
}
.operator{
	color: blue;
}</style>
</head>
<body>
	<div class="container">
	<div class="calculator">
		<input type="text" placeholder="0" id="output-screen" class="display">
		<button data-value="cl" class="operator">Cl</button>
		<button  data-value="del" class="operator">DEL</button>
		<button data-value="%" class="operator">%</button>
		<button data-value="/" class="operator">/</button>
		<button data-value="7" >7</button>
		<button data-value="8">8</button>
		<button data-value="9" >9</button>
		<button data-value="*" class="operator">*</button>
		<button data-value="4" >4</button>
		<button data-value="5">5</button>
		<button data-value="6">6</button>
		<button data-value="-" class="operator">-</button>
		<button data-value="1">1</button>
		<button data-value="2">2</button>
		<button data-value="3">3</button>
		<button data-value="+" class="operator">+</button>
		<button data-value="." class="operator">.</button>
		<button data-value="0">0</button>
		<button data-value="=" class="operator equal">=</button>
	</div>
	</div>
<script src="Calculator.js"></script>
	<script>const display=document.querySelector(".display");
const buttons=document.querySelectorAll("button");
const specialChar=["%","*","/",".", "+","="];
let output="";

//Define function to calculate based on click button
const calculate=(btnValue)=>{
	if(btnValue==="=" && btnValue!==""){
		//If output has %,replce with /100 before evaluating
		output=eval(output.replace("%","/100"));
	}else if(btnValue==="cl"){
     output=" "
	}else if(btnValue==="del"){
     //remove last character
     output=output.toString().slice(0,-1);
	} else{
		//if outout is empty and button is last specialcharacter then returns
		if(output==="" && specialChar.includes(btnValue)) return;
		output+=btnValue;
	}
display.value=output;
}
//Add event listener to buttons, call calculate on click
buttons.forEach(button=>{
	//Button click listener calls calculate() with dataset value as argument
	button.addEventListener("click",e=>{
      calculate(e.target.dataset.value);
	});
})</script>
</body>
</html>
